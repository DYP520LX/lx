<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AnythingLLM 上传</title>
<style>
body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
label { display: block; margin: 12px 0 4px; }
input { width: 100%; box-sizing: border-box; }
button { margin-top: 16px; }
pre { white-space: pre-wrap; background: #f4f4f4; padding: 12px; }
</style>
</head>
<body>
<h1>上传到第一个工作区</h1>
<p>文件会调用 POST /api/v1/document/upload，再写入第一个工作区并完成向量嵌入。</p>
<form id="f">
  <label>API Key（已在 anythingllm.json 填写则可留空）</label>
  <input name="apiKey" type="password" autocomplete="off">
  <label>文件</label>
  <input name="file" type="file" required>
  <button type="submit">上传并嵌入</button>
</form>
<pre id="out">等待操作</pre>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const out = document.getElementById("out");
  out.textContent = "上传中…";
  const res = await fetch("/upload", { method: "POST", body: new FormData(e.target) });
  out.textContent = JSON.stringify(await res.json(), null, 2);
};
</script>
</body>
</html>
